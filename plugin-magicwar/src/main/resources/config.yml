# 로비 월드 이름. server.properties 의 level-name 과 같아야 합니다.
lobby-world: "world"

# 라운드마다 새로 만들어지는 아레나 월드 폴더의 접두사. 실제 이름은 arena_<시각> 이 되고,
# 서버를 켤 때와 라운드를 정리할 때 이 접두사로 시작하는 낡은 폴더를 지웁니다.
arena-prefix: "arena_"

countdown-seconds: 10

# 아레나에 도착한 뒤 무적으로 보내는 준비 시간(초). 이 시간이 끝나야 전투와 경계 축소가 시작됩니다.
grace-seconds: 300

border:
  # -<half> ~ +<half> 정사각형이 됩니다 (999 → -999..999).
  half-width: 999
  # 경계 밖에서 1블록당 1초에 입는 피해(하트 반칸 = 1.0). 바닐라 기본은 0.2 로 훨씬 약합니다.
  damage-per-block: 1.0
  # 경계 밖 이 거리까지는 피해가 없습니다.
  damage-buffer: 1.0
  # 경계가 이 거리 안으로 들어오면 화면이 붉어집니다.
  warning-distance: 30
  # true 면 배틀그라운드처럼 축소할 때마다 중심이 옮겨갑니다. 새 원은 항상 이전 원 안에
  # 완전히 들어가므로, 안전지대 안에 있던 사람이 갑자기 밖으로 밀려나는 일은 없습니다.
  # false 면 계속 (0,0) 을 향해 좁혀집니다.
  random-center: true

# 전투 시작 후 경계가 줄어드는 순서. wait 초만큼 기다렸다가 to 크기까지 over 초에 걸쳐 줄입니다.
# to 는 지름입니다 (1998 = -999..999, 40 = -20..20).
shrink-stages:
  - { wait: 120, to: 1200, over: 90 }
  - { wait: 90,  to: 700,  over: 75 }
  - { wait: 75,  to: 350,  over: 60 }
  - { wait: 60,  to: 150,  over: 45 }
  - { wait: 45,  to: 40,   over: 40 }
